<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>FormTracker</title>
<!-- Bundled, so the app looks right without an internet connection. -->
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/300.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/400.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/500.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/600.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <img class="logo" src="assets/logo-primary-lockup.jpg" alt="Anabaptist Brotherhood" />
        <span class="app-name">FormTracker</span>
      </div>
    </header>
    <div id="app-body">
      <nav id="nav">
        <button class="nav-btn" data-page="import">Import List</button>
        <button class="nav-btn" data-page="contacts">Contacts</button>
        <button class="nav-btn" data-page="templates">Templates</button>
        <button class="nav-btn" data-page="gravity-forms">Gravity Forms</button>
        <button class="nav-btn" data-page="mailing-new">New Mailing</button>
        <button class="nav-btn" data-page="mailings">Mailings</button>
        <button class="nav-btn" data-page="tracking">Tracking</button>
        <button class="nav-btn" data-page="responses">Responses</button>
        <button class="nav-btn" data-page="settings">Settings</button>
        <div class="nav-footer">Version <span id="version-tag"></span></div>
      </nav>
      <div id="main-col">
        <div id="data-banner"></div>
        <main id="content"></main>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="app.js"></script>
  <script src="pages/import.js"></script>
  <script src="pages/contacts.js"></script>
  <script src="pages/templates.js"></script>
  <script src="pages/gravity-forms.js"></script>
  <script src="pages/mailing-new.js"></script>
  <script src="pages/mailings.js"></script>
  <script src="pages/tracking.js"></script>
  <script src="pages/responses.js"></script>
  <script src="pages/settings.js"></script>
  <script src="boot.js"></script>
</body>
</html>
